name: Remove legacy publication recovery

on:
  push:
    branches: [codex/publication-ledger-v1]
    paths:
      - scripts/remove-legacy-publication-recovery.mjs
      - .github/workflows/remove-legacy-publication-recovery.yml

permissions:
  contents: read

jobs:
  remove:
    if: github.repository == 'AyobamiH/social-agents' && github.ref == 'refs/heads/codex/publication-ledger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Remove exact legacy implementation
        run: node scripts/remove-legacy-publication-recovery.mjs
      - name: Prove full repository after removal
        run: npm run ci
      - name: Commit only validated source change
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "src/supabase-worker.ts "
          remote_head=$(git ls-remote origin refs/heads/codex/publication-ledger-v1 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/supabase-worker.ts
          git commit -m 'Remove legacy publication recovery heuristic'
          git push origin HEAD:refs/heads/codex/publication-ledger-v1

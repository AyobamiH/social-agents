name: Assemble and verify durable job candidate
on:
  push:
    branches: [codex/durable-agent-jobs-20260928]
    paths: ['scripts/assemble-agent-jobs.py', '.github/workflows/assemble-agent-jobs.yml']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'AyobamiH/social-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 scripts/assemble-agent-jobs.py
      - run: npm ci
      - run: npm run ci
      - name: Save tested blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const path of ['src/supabase-worker.ts','test/scheduler-isolation.test.ts','package.json']) {
            const content=readFileSync(path,'utf8');
            const response=await fetch('https://api.github.com/repos/AyobamiH/social-agents/git/blobs',{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(15000),
              headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json',Accept:'application/vnd.github+json'},
              body:JSON.stringify({content,encoding:'utf-8'})});
            if(!response.ok) throw new Error('Candidate blob write failed');
            const result=await response.json();const bytes=Buffer.from(content);
            const sha=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if(result.sha!==sha)throw new Error('Blob identity mismatch');
            console.log(JSON.stringify({path,sha}));
          }
          NODE

name: deploy-cloudflare-worker

# Source merges are not deployment authorisation. Keep publication rollout
# manual while the schema-first staging, drain and canary gates are outstanding.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full upstream main SHA reviewed for this deployment'
        required: true
        type: string
      rollout_preflight_confirmed:
        description: 'Owner confirms schema capability, legacy drain and staging evidence for this SHA'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'OneClickPostFactory/social-agents' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require exact release identity and explicit rollout approval
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SHA: ${{ github.sha }}
          ROLLOUT_PREFLIGHT_CONFIRMED: ${{ inputs.rollout_preflight_confirmed }}
        run: |
          set -eu
          test "$ROLLOUT_PREFLIGHT_CONFIRMED" = 'true'
          test "$EXPECTED_SHA" = "$RELEASE_SHA"
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npx wrangler deploy --tag "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

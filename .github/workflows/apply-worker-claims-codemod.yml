name: Apply worker claim codemod

on:
  push:
    branches:
      - codex/atomic-worker-claims
    paths:
      - .github/workflows/apply-worker-claims-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/atomic-worker-claims
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Relax brittle local-variable assertion without weakening source eligibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/source-ssrf.test.ts')
          source = path.read_text()
          old = r"/isProcessableSourceRecordForAngleExtraction\(record, sourceUrlsWithAngles\)/"
          new = r"/isProcessableSourceRecordForAngleExtraction\((?:record|candidate), sourceUrlsWithAngles\)/"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one source eligibility assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - run: node scripts/prepare-worker-claims-codemod.mjs
      - run: node --check scripts/apply-worker-claims-codemod.mjs
      - run: node scripts/apply-worker-claims-codemod.mjs
      - run: npm run ci
      - name: Commit guarded orchestration cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/supabase-worker.ts test/source-ssrf.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "Use fenced database claims for paid generation"
          git push origin HEAD:codex/atomic-worker-claims
